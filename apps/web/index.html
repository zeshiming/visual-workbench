<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/assets/styles/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Doushabao is an open-source web AI image editor with both Agent and Editor modes."
    />
    <meta name="apple-mobile-web-app-title" content="Doushabao" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Doushabao</title>
    <script>
      try {
        if (localStorage.getItem("doushabao:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
